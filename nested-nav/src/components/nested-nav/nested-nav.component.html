<nav role="navigation" class="row" aria-label="navigation">
    <ng-container *ngTemplateOutlet="navitem; context:{items: items}"></ng-container>
</nav>

<ng-template #navitem let-items="items">
    <div class="" *ngFor="let item of items">
        <a class="" [routerLink]="item.href || []" [title]="item.title">
            {{item.title}}
        </a>
        <ng-container *ngIf="item.children?.length">
            <ng-container *ngTemplateOutlet="navitem; context:{items: item.children}"></ng-container>
        </ng-container>
    </div>
</ng-template>
